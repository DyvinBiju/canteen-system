<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        /* Set full-screen background image */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Background image with blur effect */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://t3.ftcdn.net/jpg/01/54/14/86/360_F_154148685_yvijeC6L2SFpvqFJ5H1lunPg40FzCAf1.jpg') no-repeat center center/cover;
            filter: blur(8px);
            z-index: -1;
        }

        /* Glassmorphism Effect Card */
        .popup-card {
            background: rgba(255, 255, 255, 0.2);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(12px);
            max-width: 450px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            position: relative;
            z-index: 10;
        }

        /* Profile picture with glowing effect */
        .profile-picture {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        /* Styling for Full Name and Email labels */
        .info-label {
            font-size: 18px;
            font-weight: 600;
            color: rgb(0, 0, 0);
            margin-top: 10px;
        }

        /* Box for Name & Email values only */
        .info-box {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px;
            border-radius: 8px;
            display: inline-block;
            min-width: 250px;
            text-align: center;
            font-size: 20px;
            font-weight: 500;
            color: rgb(255, 255, 255);
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 10px;
        }

        /* Buttons */
        .edit-button, .upload-button {
            display: inline-block;
            padding: 12px 20px;
            margin-top: 15px;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s ease;
            font-weight: 500;
            border: none;
            outline: none;
        }

        .edit-button {
            background: linear-gradient(45deg, #cbef02, #06e1a3);
        }

        .edit-button:hover {
            background: linear-gradient(45deg, #eef112, #09f3d7);
            transform: scale(1.05);
        }

        .upload-button {
            background: linear-gradient(45deg, #d2e108, #06e8d9);
        }

        .upload-button:hover {
            background: linear-gradient(45deg, #07e07b, #3ac015);
            transform: scale(1.05);
        }

        /* Home Button - Smaller & Bottom Left */
        .home-button {
            background: linear-gradient(45deg, #000000, #f80505);
            padding: 8px 14px;
            font-size: 14px;
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #ffffff;
        }

        .home-button:hover {
            background: linear-gradient(45deg, #ebe8e7, #04ffea);
            transform: scale(1.05);
            color: #000000;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .popup-card {
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <div class="popup-card">
        <h1>Profile</h1>
        <div>
            {% if user_profile.profile_picture %}
                <img src="{{ user_profile.profile_picture.url }}" alt="Profile Picture" class="profile-picture">
            {% else %}
                <p>No profile picture uploaded.</p>
            {% endif %}
            
            <!-- Labels outside, only values inside the box -->
            <p class="info-label">Full Name:</p>
            <div class="info-box">{{ user.username }}</div>

            <p class="info-label">Email:</p>
            <div class="info-box">{{ user.email }}</div>
        </div>

        <form method="post" enctype="multipart/form-data" action="{% url 'upload_profile_picture' %}" id="upload-form">
            {% csrf_token %}
            <input type="file" name="profile_picture" accept="image/*" style="display: none;" id="profile-picture-input">
            <button style="color: #000000;" type="button" class="upload-button" onclick="document.getElementById('profile-picture-input').click()">Upload Image</button>
        </form>

        <a style="color: #000000;" href="{% url 'edit_profile' %}" class="edit-button">Edit Profile</a>

        <!-- Home Button at Bottom Left -->
        <a href="{% url 'home' %}" class="home-button"> << Home </a>
    </div>

    <script>
        document.getElementById('profile-picture-input').addEventListener('change', function() {
            document.getElementById('upload-form').submit();
        });
    </script>
</body>
</html>
