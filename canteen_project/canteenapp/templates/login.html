<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delfood - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #f1f5f9;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .card {
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .form-header {
      background-color: #007bff;
      color: white;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      padding: 15px 0;
    }

    .form-body {
      padding: 25px;
    }

    h3 {
        text-align: center;
        margin-top: 5px;
        margin-bottom: 10px;
        font-size: 30px;
        color: #007bff;
        font-weight: 600;
        }



    label {
      display: block;
      font-weight: 500;
      margin-bottom: 5px;
      margin-top: 15px;
      font-size: 17px;
    }

    .form-control {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      background-color: #f9f9f9;
    }

    .position-relative {
      position: relative;
    }

    .eye-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: #888;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 25px;
    }

    .btn:hover {
      background-color: #0069d9;
    }

    .text-center {
      text-align: center;
    }

    .mt-3 {
      margin-top: 1rem;
    }

    a {
      color: #007bff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .alert {
      background-color: #f8d7da;
      color: #721c24;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .invalid-feedback {
      color: #dc3545;
      font-size: 13px;
      margin-top: 4px;
      display: none;
    }

    .was-validated .form-control:invalid + .invalid-feedback {
      display: block;
    }

    .was-validated .form-control:invalid {
      border-color: #dc3545;
    }

    .was-validated .form-control:valid {
      border-color: #28a745;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="form-header">
      <a href="{% url 'home' %}" style="color: white; text-decoration: none;">Delfood</a>
    </div>
    <div class="form-body">
      <h3>Login</h3>

      {% if messages %}
      <div class="alert">
        {% for message in messages %}
        <div>{{ message }}</div>
        {% endfor %}
      </div>
      {% endif %}

      <form method="post" id="loginForm" novalidate>
        {% csrf_token %}

        <label for="username">User Name</label>
        <input type="text" id="username" name="username" class="form-control" required>
        <div class="invalid-feedback">Please enter your username.</div>

        <label for="password">Password</label>
        <div class="position-relative">
          <input type="password" id="password" name="password" class="form-control" required>
          <span class="eye-toggle" onclick="togglePassword()">&#128065;</span>
        </div>
        <div class="invalid-feedback">Please enter a password.</div>

        <button type="submit" class="btn">Login</button>
      </form>

      <p class="text-center mt-3">Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p>
    </div>
  </div>
</div>

<script>
  function togglePassword() {
    const input = document.getElementById("password");
    input.type = input.type === "password" ? "text" : "password";
  }

  document.getElementById('loginForm').addEventListener('submit', function (event) {
    const form = event.target;
    if (!form.checkValidity()) {
      event.preventDefault();
      event.stopPropagation();
      form.classList.add('was-validated');
    }
  });
</script>

</body>
</html>
